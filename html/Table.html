
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixCode Academy - Membership Plans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>SixCode Academy — Membership Plans</h1>

    <div class="table-wrapper">
      <table class="pricing-table">
        <thead>
          <tr>
            <th scope="col">Plan</th>
            <th scope="col">Price / month</th>
            <th scope="col">Mentor Support</th>
            <th scope="col">Included</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Basic</th>
            <td class="price">$19</td>
            <td>Community only</td>
            <td class="included">
              <span class="check" aria-label="Included">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12.5 9.5 17 19 7"/>
                </svg>
              </span>
            </td>
          </tr>

          <tr>
            <th scope="row">Standard</th>
            <td class="price">$49</td>
            <td>Weekly check-in</td>
            <td class="included">
              <span class="check" aria-label="Included">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12.5 9.5 17 19 7"/>
                </svg>
              </span>
            </td>
          </tr>

          <tr>
            <th scope="row">Premium</th>
            <td class="price">$99</td>
            <td>Daily 1:1 mentor</td>
            <td class="included">
              <span class="check" aria-label="Included">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 12.5 9.5 17 19 7"/>
                </svg>
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
