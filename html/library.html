<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Library</title>
  <link rel="stylesheet" href="../css/library.css" />
  <script src="../javascript/Library.js" defer></script>
</head>
<body>
  <header>
    <h1>My Library</h1>
    <button id="new-book-btn" type="button">+ New Book</button>
  </header>

  <main>
    <p id="empty-message" hidden>No books yet. Add your first one!</p>
    <section id="library" class="library"></section>
  </main>

  <dialog id="book-dialog">
    <form id="book-form" method="dialog">
      <h2>Add a book</h2>

      <label for="title">Title</label>
      <input type="text" id="title" name="title" required />

      <label for="author">Author</label>
      <input type="text" id="author" name="author" required />

      <label for="pages">Pages</label>
      <input type="number" id="pages" name="pages" min="1" required />

      <label class="checkbox">
        <input type="checkbox" id="read" name="read" />
        I have read this book
      </label>

      <div class="actions">
        <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        <button type="submit">Add Book</button>
      </div>
    </form>
  </dialog>
</body>
</html>
